  <body data-root="../" data-theme="dark" class="login-page">
    <script>try{const saved=localStorage.getItem('frameiq-theme');document.body.dataset.theme=saved==='light'||saved==='dark'?saved:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(error){document.body.dataset.theme=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}</script>
    <a class="skip-link" href="#login-form">Skip to sign in</a>
    <div id="site-header"></div>

    <main class="login-main">
      <div class="login-photo photo-frame" data-photo="login-bg" data-photo-loading="eager" aria-hidden="true"><img width="1600" height="900" alt="" hidden></div>
      <section class="login-card" aria-labelledby="login-title">
        <a class="login-back icon-button" href="../index.html" aria-label="Back to FrameIQ home">
          <i class="bi bi-arrow-left" aria-hidden="true"></i>
        </a>

        <header class="login-card__heading">
          <h1 id="login-title">Welcome <span class="text-gradient">Back</span></h1>
          <p>Sign in to your account to continue</p>
        </header>

        <form id="login-form" class="login-form" novalidate>
          <div class="login-field">
            <label for="login-email">Email</label>
            <div class="login-input-wrap">
              <i class="bi bi-envelope" aria-hidden="true"></i>
              <input id="login-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" inputmode="email" required aria-describedby="email-error" />
            </div>
            <span class="login-field__error" id="email-error" aria-live="polite"></span>
          </div>

          <div class="login-field">
            <div class="login-field__label-row">
              <label for="login-password">Password</label>
              <a class="login-inline-link" href="contact.html">Need help? Contact us</a>
            </div>
            <div class="login-input-wrap">
              <i class="bi bi-lock" aria-hidden="true"></i>
              <input id="login-password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
              <button class="login-password-toggle" type="button" aria-label="Show password" aria-pressed="false" data-password-toggle>
                <i class="bi bi-lock" aria-hidden="true"></i>
              </button>
            </div>
            <span class="login-field__error" id="password-error" aria-live="polite"></span>
          </div>

          <button class="login-submit" type="submit">Sign In</button>
          <p class="login-status" role="status" aria-live="polite" data-login-status></p>
        </form>

        <div class="login-divider"><span>or</span></div>

        <button class="login-google" type="button" data-google-sign-in disabled aria-disabled="true">
          <i class="bi bi-google" aria-hidden="true"></i>
          Continue with Google <span class="login-coming-soon">Coming soon</span>
        </button>

        <p class="login-consent">By continuing you agree to the <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>.</p>
        <p class="login-signup">Don't have an account? <a href="contact.html">Sign up</a></p>
      </section>
    </main>
  </body>
