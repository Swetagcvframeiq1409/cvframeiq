<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Careers | FrameIQ</title>
    <meta name="description" content="No open roles right now. Send FrameIQ your CV for future consideration." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Careers | FrameIQ" />
    <meta property="og:description" content="No open roles right now. Send FrameIQ your CV for future consideration." />
    <meta property="og:url" content="https://example.invalid/pages/careers.html" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../assets/css/tokens.css" />
    <link rel="stylesheet" href="../assets/fonts/bootstrap-icons.css" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/nav-fix.css" />
    <link rel="stylesheet" href="../assets/css/gk-kit.css" />
    <link rel="stylesheet" href="../assets/css/careers-page.css" />
    <script src="../assets/data/site-data.js" defer></script>
    <script src="../assets/js/icons.js" defer></script>
    <script src="../assets/js/components.js" defer></script>
    <script src="../assets/js/main.js" defer></script>
    <script src="../assets/js/careers-page.js" defer></script>
      <meta name="color-scheme" content="dark" />
</head>
  <body data-root="../">
        <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="site-header"></div>
    <main id="main-content" class="cu-page jn-page">
      <section class="jn-hero">
        <div class="cu-wrap">
          <h1 class="jn-title">Careers</h1>
          <p class="jn-lead">No open roles right now — send us your CV for future consideration.</p>
        </div>
      </section>
      <section class="jn-open" id="openings">
        <div class="cu-wrap">
          <h2 class="jn-h2">Openings</h2>
          <p class="jn-empty">No open roles right now — send us your CV.</p>
        </div>
      </section>
      <section class="jn-contact" id="application">
        <div class="cu-wrap">
          <div class="jn-contact__box">
            <form class="jn-form" id="jnForm" novalidate>
              <h2 class="jn-form__h">Send your CV</h2>
              <div class="jn-form__grid">
                <label>Name *<input type="text" name="name" required autocomplete="name" aria-describedby="jn-name-error"><span class="jn-field-error" id="jn-name-error"></span></label>
                <label>Email *<input type="email" name="email" required autocomplete="email" aria-describedby="jn-email-error"><span class="jn-field-error" id="jn-email-error"></span></label>
                <label>Phone<input type="tel" name="phone" autocomplete="tel"></label>
                <label>Role applied for *<input type="text" name="role" required aria-describedby="jn-role-error"><span class="jn-field-error" id="jn-role-error"></span></label>
                <label class="jn-full">LinkedIn profile<input type="url" name="linkedin" autocomplete="url" aria-describedby="jn-linkedin-error"><span class="jn-field-error" id="jn-linkedin-error"></span></label>
                <label class="jn-full">Resume upload *<input type="file" name="resume" accept=".pdf,.doc,.docx" required aria-describedby="jn-resume-error"><span class="jn-field-error" id="jn-resume-error"></span></label>
                <label class="jn-full">Message<textarea name="message" rows="4"></textarea></label>
              </div>
              <label class="jn-check">
                <input type="checkbox" name="privacy" required aria-describedby="jn-consent-error">
                <span>I agree to be contacted about this application and acknowledge the <a href="privacy.html">Privacy Policy</a>.</span>
              </label>
              <span class="jn-field-error" id="jn-consent-error"></span>
              <button class="jn-submit" type="submit">Continue to email <i class="bi bi-arrow-right" aria-hidden="true"></i></button>
              <p class="jn-status" id="jnStatus" role="status" aria-live="polite">This form opens an email draft. Attach your CV to the draft before sending.</p>
            </form>
          </div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
  </body>
</html>
