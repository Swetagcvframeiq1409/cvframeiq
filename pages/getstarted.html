  <body data-root="../" data-theme="dark" class="login-page">
    <script>try{const saved=localStorage.getItem('frameiq-theme');document.body.dataset.theme=saved==='light'||saved==='dark'?saved:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(error){document.body.dataset.theme=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}</script>
    <a class="skip-link" href="#getstarted-form">Skip to enquiry</a>
    <div id="site-header"></div>

    <main class="login-main">
      <div class="login-photo photo-frame" data-photo="login-bg" data-photo-loading="eager" aria-hidden="true"><img width="1600" height="900" alt="" hidden></div>
      <section class="login-card getstarted-card" aria-labelledby="getstarted-title">
        <a class="login-back icon-button" href="../index.html" aria-label="Back to FrameIQ home">
          <i class="bi bi-arrow-left" aria-hidden="true"></i>
        </a>

        <header class="login-card__heading">
          <h1 id="getstarted-title">Send an <span class="text-gradient">Enquiry</span></h1>
          <p>Tell us a little about what you need. Accounts are not open yet.</p>
        </header>

        <form id="getstarted-form" class="login-form" novalidate>
          <div class="login-honeypot" aria-hidden="true">
            <label for="signup-website">Leave this field empty</label>
            <input id="signup-website" name="_gotcha" type="text" tabindex="-1" autocomplete="off" />
          </div>
          <div class="login-field">
            <label for="signup-name">Full name</label>
            <div class="login-input-wrap">
              <i class="bi bi-people" aria-hidden="true"></i>
              <input id="signup-name" name="name" type="text" placeholder="Your name" autocomplete="name" required aria-describedby="signup-name-error" />
            </div>
            <span class="login-field__error" id="signup-name-error" aria-live="polite"></span>
          </div>

          <div class="login-field">
            <label for="signup-email">Email</label>
            <div class="login-input-wrap">
              <i class="bi bi-envelope" aria-hidden="true"></i>
              <input id="signup-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" inputmode="email" required aria-describedby="signup-email-error" />
            </div>
            <span class="login-field__error" id="signup-email-error" aria-live="polite"></span>
          </div>

          <div class="login-field">
            <label for="signup-project">What do you want to build? <span class="login-optional">(optional)</span></label>
            <div class="login-input-wrap login-input-wrap--textarea">
              <i class="bi bi-chat-dots" aria-hidden="true"></i>
              <textarea id="signup-project" name="projectDetails" rows="4" placeholder="A short description is enough" aria-describedby="signup-project-help"></textarea>
            </div>
            <span class="login-field__hint" id="signup-project-help">Do not include passwords or sensitive information.</span>
          </div>

          <button class="login-submit" type="submit">Send an Enquiry</button>
          <p class="login-status" role="status" aria-live="polite" data-getstarted-status></p>
        </form>

        <div class="login-divider"><span>or</span></div>

        <button class="login-google" type="button" data-google-sign-up disabled aria-disabled="true">
          <i class="bi bi-google" aria-hidden="true"></i>
          Sign up with Google <span class="login-coming-soon">Coming soon</span>
        </button>

        <p class="login-consent">By continuing you agree to the <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>.</p>
        <p class="login-signup">Already have an account? <a href="login.html">Sign in</a></p>
      </section>
    </main>
